name: Product Comments E2E Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  product-comments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Product Comments E2E Tests
        run: bun run test:product-comments

      - name: Upload Product Comments screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-comments-screenshots
          path: cypress/screenshots/

      - name: Upload Product Comments report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-comments-report
          path: cypress/reports/
