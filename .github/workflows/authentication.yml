name: Authentication E2E Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  authentication:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Authentication E2E Tests
        run: bun run test:authentication

      - name: Upload Authentication screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentication-screenshots
          path: cypress/screenshots/

      - name: Upload Authentication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authentication-report
          path: cypress/reports/
